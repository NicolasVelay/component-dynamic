name: Pre-release

run-name: Pre-release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      notes:
        description: "Release notes (leave empty for default)"
        required: false
        type: string

jobs:
  prerelease:
    name: Pre-release
    concurrency:
      group: release-package
      cancel-in-progress: true
    permissions:
      contents: write
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Calculate alpha version
        id: version
        run: bash ./.github/scripts/get-prerelease-version.sh "${{ inputs.bump }}"
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES="Pre-release from branch \`${{ github.ref_name }}\`"
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --prerelease
