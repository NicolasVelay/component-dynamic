name: Check PR

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check:
    name: Validate title & release notes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Validate PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash ./.github/scripts/check-pr.sh
